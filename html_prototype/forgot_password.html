<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grōv — Forgot Password</title>
  <link rel="stylesheet" href="./shared-ios-glass.css"/>
  <style>
    .fp-shell {
      width: 100%; max-width: 430px; min-height: 100dvh;
      margin: 0 auto; padding: 52px 20px 32px;
      display: flex; flex-direction: column; gap: 28px;
      background: var(--surface);
    }
    .back-btn {
      position: absolute; top: 16px; left: 16px;
      width: 36px; height: 36px; border-radius: var(--r-sm);
      background: var(--card); border: 1px solid var(--card-border);
      display: grid; place-items: center; color: var(--text-2);
    }
    .form-card {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: var(--r-xl); padding: 20px;
      display: flex; flex-direction: column; gap: 16px;
      box-shadow: var(--shadow-sm);
    }
    .divider { height: 1px; background: var(--card-border); }
    .hint { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  </style>
</head>
<body style="background:var(--surface);">
  <a href="./login_screen.html" class="back-btn">
    <span class="material-icons-round" style="font-size:18px;">arrow_back</span>
  </a>

  <div class="fp-shell">
    <div class="anim" style="display:flex;flex-direction:column;gap:12px;">
      <div class="entry-mark">
        <span class="material-icons-round" style="font-size:22px;">lock_reset</span>
      </div>
      <span class="entry-kicker">Account Recovery</span>
      <h1 class="entry-h1">Reset your<br>password.</h1>
      <p class="entry-sub">We'll send a recovery link to your email address.</p>
    </div>

    <form action="./login_screen.html" class="form-card anim anim-2">
      <div class="form-group">
        <label class="form-label" for="fpEmail">Email Address</label>
        <input id="fpEmail" type="email" class="form-input" placeholder="you@example.com"/>
      </div>
      <p class="hint">Check your spam folder if you don't receive the email within a few minutes.</p>
      <div class="divider"></div>
      <button type="submit" class="btn btn-primary">Send Recovery Link</button>
    </form>

    <a href="./login_screen.html" style="text-align:center;font-size:13px;font-weight:700;color:var(--text-3);" class="anim anim-3">Back to Sign In</a>
  </div>
</body>
</html>
