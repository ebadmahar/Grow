<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grōv — Seeding Logged</title>
  <link rel="stylesheet" href="./shared-ios-glass.css"/>
  <style>
    body { background: var(--surface); }
    .confirm-shell {
      width: 100%; max-width: 430px; min-height: 100dvh;
      margin: 0 auto; padding: 48px 20px 40px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px; text-align: center;
    }
    .success-ring {
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(122,90,248,0.08); border: 2px solid rgba(122,90,248,0.25);
      display: grid; place-items: center;
      animation: ring-pulse 0.6s var(--ease) both;
    }
    .success-inner {
      width: 74px; height: 74px; border-radius: 50%;
      background: #F3E8FF; display: grid; place-items: center; color: #7A5AF8;
    }
    .success-inner .material-icons-round { font-size: 36px; }
    @keyframes ring-pulse { from { transform:scale(0.7);opacity:0; } to { transform:scale(1);opacity:1; } }
    .confirm-heading { font-size: 28px; font-weight: 800; letter-spacing: -0.06em; color: var(--text-1); line-height: 1.1; }
    .confirm-sub { font-size: 14px; color: var(--text-3); line-height: 1.6; max-width: 28ch; }
    .data-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 999px; padding: 8px 16px;
      font-size: 13px; font-weight: 700; color: var(--text-1);
    }
    .data-pill .material-icons-round { font-size: 16px; color: #7A5AF8; }
    .next-actions { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .status-note { font-size: 11px; color: var(--text-muted); line-height: 1.5; background: var(--surface-2); border-radius: var(--r-sm); padding: 12px; text-align: left; }
  </style>
</head>
<body>
<div class="confirm-shell">
  <div class="success-ring anim">
    <div class="success-inner">
      <span class="material-icons-round">grass</span>
    </div>
  </div>
  <div class="anim anim-2" style="display:flex;flex-direction:column;gap:10px;align-items:center;">
    <h1 class="confirm-heading">Seeds<br>Recorded.</h1>
    <p class="confirm-sub">Your seed bombing activity is logged and mapped.</p>
  </div>
  <div class="anim anim-3" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
    <div class="data-pill"><span class="material-icons-round">grass</span>500 Seeds</div>
    <div class="data-pill"><span class="material-icons-round" style="color:#0891B2;">location_on</span>G-11 Trail</div>
  </div>
  <p class="status-note anim anim-3">
    Status: <strong>Reported</strong> — monitoring records will track how many seeds germinate. The first observation should happen 4–8 weeks after dispersal.
  </p>
  <div class="next-actions anim anim-4">
    <a href="./seeding_monitoring.html" class="btn btn-primary">
      <span class="material-icons-round" style="font-size:18px;">visibility</span>
      Schedule Monitoring
    </a>
    <a href="./home_dashboard.html" class="btn btn-ghost">Back to Home</a>
  </div>
</div>
</body>
</html>
