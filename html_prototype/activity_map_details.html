<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grōv — Activity on Map</title>
  <link rel="stylesheet" href="./shared-ios-glass.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { overflow:hidden; }
    .map-full { position:fixed;inset:0;z-index:0; }
    .detail-panel {
      position:fixed;bottom:0;left:0;right:0;z-index:50;
      max-width:430px;margin:0 auto;
      background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);
      border-top:1px solid var(--card-border);
      border-radius:var(--r-xl) var(--r-xl) 0 0;
      padding:20px 20px 100px;
      display:flex;flex-direction:column;gap:12px;
      box-shadow:0 -8px 32px rgba(0,0,0,0.12);
    }
    .drag-handle { width:36px;height:4px;border-radius:999px;background:var(--card-border);margin:0 auto 4px; }
    .detail-title { font-size:17px;font-weight:800;letter-spacing:-0.04em;color:var(--text-1); }
    .detail-meta { font-size:12px;color:var(--text-muted); }
    .detail-row { display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--card-border); }
    .detail-row:last-of-type { border-bottom:none; }
    .detail-icon { width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0; }
    .detail-icon .material-icons-round { font-size:15px; }
  </style>
</head>
<body>
  <div class="map-full"><div id="mapDetail" style="width:100%;height:100%;"></div></div>
  <header class="app-header" style="position:fixed;top:0;left:0;right:0;max-width:430px;margin:0 auto;background:rgba(244,247,240,0.88);">
    <a href="./activity_details.html" class="icon-btn"><span class="material-icons-round">arrow_back</span></a>
    <h1 class="header-title">Activity Location</h1>
    <a href="./notifications.html" class="icon-btn"><span class="material-icons-round">notifications</span></a>
  </header>
  <div class="detail-panel">
    <div class="drag-handle"></div>
    <div>
      <div class="detail-title">Chir Pine Reforestation</div>
      <div class="detail-meta">Margalla Hills Zone 1 · 24 Aug 2026</div>
    </div>
    <div style="display:flex;gap:6px;">
      <span class="badge badge-green">Verified</span>
      <span class="badge badge-neutral">120 Saplings</span>
      <span class="badge badge-lime">Plantation</span>
    </div>
    <div>
      <div class="detail-row">
        <div class="detail-icon" style="background:#EAF9EF;"><span class="material-icons-round" style="color:#1A6636;">location_on</span></div>
        <div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);">GPS Coordinates</div><div style="font-size:12px;font-weight:700;color:var(--text-1);margin-top:1px;">33.73811, 73.06500</div></div>
      </div>
      <div class="detail-row">
        <div class="detail-icon" style="background:var(--surface-2);"><span class="material-icons-round" style="color:var(--text-3);">gps_fixed</span></div>
        <div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);">GPS Accuracy</div><div style="font-size:12px;font-weight:700;color:var(--text-1);margin-top:1px;">±8 meters</div></div>
      </div>
    </div>
    <a href="./plantation_monitoring.html" class="btn btn-lime">
      <span class="material-icons-round" style="font-size:18px;">visibility</span>
      Add Monitoring Record
    </a>
  </div>
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    var map = L.map('mapDetail', {zoomControl:false,attributionControl:false}).setView([33.7381,73.0650],15);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18}).addTo(map);
    var icon = L.divIcon({
      className:'user-placed-pin',
      html:'<span class="material-icons-round" style="font-size:16px;">forest</span>',
      iconSize:[36,36],iconAnchor:[18,18]
    });
    L.marker([33.7381,73.0650],{icon:icon}).addTo(map).bindPopup('<b>Chir Pine Reforestation</b><br>120 Saplings · Verified').openPopup();
  });
  </script>
</body>
</html>
