<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grōv — Profile Setup</title>
  <link rel="stylesheet" href="./shared-ios-glass.css"/>
  <style>
    .setup-shell {
      width: 100%; max-width: 430px; min-height: 100dvh;
      margin: 0 auto; padding: 52px 20px 32px;
      display: flex; flex-direction: column; gap: 28px;
      background: var(--surface);
    }
    .back-btn {
      position: absolute; top: 16px; left: 16px;
      width: 36px; height: 36px; border-radius: var(--r-sm);
      background: var(--card); border: 1px solid var(--card-border);
      display: grid; place-items: center; color: var(--text-2);
    }
    .form-card {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: var(--r-xl); padding: 20px;
      display: flex; flex-direction: column; gap: 16px;
      box-shadow: var(--shadow-sm);
    }
    .avatar-block {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      padding: 16px; border-bottom: 1px solid var(--card-border);
    }
    .avatar-upload {
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--surface-2); border: 2px dashed var(--card-border);
      display: grid; place-items: center; cursor: pointer;
      overflow: hidden; position: relative;
    }
    .avatar-upload img {
      width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0;
    }
    .avatar-change-btn {
      font-size: 12px; font-weight: 700; color: var(--text-3);
    }
    .divider { height: 1px; background: var(--card-border); }
    .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .role-option {
      padding: 12px; border-radius: var(--r-sm);
      border: 1.5px solid var(--card-border); background: var(--surface);
      cursor: pointer; text-align: center;
      font-size: 12px; font-weight: 700; color: var(--text-2);
      transition: all var(--dur) var(--ease);
    }
    .role-option.selected { background: var(--ink); border-color: var(--ink); color: var(--lime); }
  </style>
</head>
<body style="background:var(--surface);">
  <a href="./interest_selection.html" class="back-btn">
    <span class="material-icons-round" style="font-size:18px;">arrow_back</span>
  </a>

  <div class="setup-shell">
    <div class="anim" style="display:flex;flex-direction:column;gap:12px;">
      <div class="entry-mark">
        <span class="material-icons-round" style="font-size:22px;">person</span>
      </div>
      <span class="entry-kicker">Almost There</span>
      <h1 class="entry-h1">Your field<br>identity.</h1>
      <p class="entry-sub">Tell us a bit more so the community can find and trust your work.</p>
    </div>

    <form action="./home_dashboard.html" class="form-card anim anim-2">
      <div class="avatar-block">
        <div class="avatar-upload" id="avatarBox">
          <span class="material-icons-round" style="font-size:28px;color:var(--text-muted);">add_a_photo</span>
          <img id="avatarPreview" src="" alt="" style="display:none;"/>
        </div>
        <span class="avatar-change-btn">Tap to upload photo</span>
        <input type="file" id="avatarInput" accept="image/*" style="display:none;"/>
      </div>

      <div class="form-group">
        <label class="form-label" for="setupLocation">Your Location / Region</label>
        <input id="setupLocation" type="text" class="form-input" placeholder="Islamabad, Pakistan" value="Islamabad, Pakistan"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="setupBio">Short Bio</label>
        <textarea id="setupBio" class="form-input form-textarea" placeholder="Tell the community about your restoration work...">Field restoration lead focused on Margalla Hills native species recovery.</textarea>
      </div>
      <div class="divider"></div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <span class="form-label">Role</span>
        <div class="role-grid">
          <div class="role-option selected" id="roleVolunteer">Volunteer</div>
          <div class="role-option" id="roleCoordinator">Coordinator</div>
        </div>
      </div>
      <div class="divider"></div>
      <button type="submit" class="btn btn-primary">Launch Grōv</button>
    </form>
  </div>

  <script>
    document.getElementById('avatarBox').addEventListener('click', function() {
      document.getElementById('avatarInput').click();
    });
    document.getElementById('avatarInput').addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (file) {
        var reader = new FileReader();
        reader.onload = function(evt) {
          var img = document.getElementById('avatarPreview');
          img.src = evt.target.result;
          img.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });
    ['roleVolunteer','roleCoordinator'].forEach(function(id) {
      document.getElementById(id).addEventListener('click', function() {
        document.querySelectorAll('.role-option').forEach(function(el){ el.classList.remove('selected'); });
        this.classList.add('selected');
      });
    });
  </script>
</body>
</html>
