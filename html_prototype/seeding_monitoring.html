<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grōv — Seeding Monitoring</title>
  <link rel="stylesheet" href="./shared-ios-glass.css"/>
  <style>
    .form-card { background:var(--card);border:1px solid var(--card-border);border-radius:var(--r-xl);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-sm); }
    .linked-activity { background:var(--surface-2);border-radius:var(--r-md);padding:14px;display:flex;align-items:center;gap:12px; }
    .linked-icon { width:40px;height:40px;border-radius:13px;background:#F3E8FF;display:grid;place-items:center;flex-shrink:0; }
    .linked-icon .material-icons-round { font-size:20px;color:#7A5AF8; }
    .media-upload { height:100px;border:1.5px dashed var(--card-border);border-radius:var(--r-md);background:var(--surface);display:grid;place-items:center;cursor:pointer; }
    .upload-inner { display:flex;flex-direction:column;align-items:center;gap:5px; }
    .upload-inner .material-icons-round { font-size:24px;color:var(--text-muted); }
  </style>
</head>
<body>
<div class="app-shell screen">
  <header class="app-header">
    <a href="./activity_details.html" class="icon-btn"><span class="material-icons-round">arrow_back</span></a>
    <h1 class="header-title">Seed Monitoring</h1>
    <a href="./notifications.html" class="icon-btn"><span class="material-icons-round">notifications</span></a>
  </header>
  <main class="p-page" style="display:flex;flex-direction:column;gap:14px;">
    <div class="linked-activity anim">
      <div class="linked-icon"><span class="material-icons-round">grass</span></div>
      <div>
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);">Monitoring</div>
        <div style="font-size:13px;font-weight:700;color:var(--text-1);">G-11 Seed Bombing Mission</div>
        <div style="font-size:11px;color:var(--text-muted);">500 Seeds · 21 Aug 2026</div>
      </div>
    </div>
    <form action="./home_dashboard.html" class="form-card anim anim-2">
      <div class="form-group">
        <label class="form-label">Observation Date</label>
        <input type="date" class="form-input" id="obsDate"/>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Seedlings Observed</label>
          <input type="number" class="form-input" placeholder="Germinated count" value="240"/>
        </div>
        <div class="form-group">
          <label class="form-label">Established</label>
          <input type="number" class="form-input" placeholder="Rooted" value="180"/>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Surviving</label>
          <input type="number" class="form-input" placeholder="Still growing" value="165"/>
        </div>
        <div class="form-group">
          <label class="form-label">Dead / Failed</label>
          <input type="number" class="form-input" placeholder="Count" value="15"/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Germination Condition</label>
        <select class="form-input form-select">
          <option>Good — widespread germination</option>
          <option>Fair — patchy germination</option>
          <option>Poor — minimal germination</option>
          <option>Unknown</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea class="form-input form-textarea" placeholder="Growth density, patch coverage, watering status, weed competition..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Photos</label>
        <div class="media-upload" id="mu"><div class="upload-inner"><span class="material-icons-round">add_photo_alternate</span><span style="font-size:11px;font-weight:600;color:var(--text-3);">Add Photos</span></div></div>
        <input type="file" id="mi" accept="image/*" multiple style="display:none;"/>
      </div>
      <button type="submit" class="btn btn-primary"><span class="material-icons-round" style="font-size:18px;">check_circle</span>Submit Observation</button>
    </form>
  </main>
  <nav class="bottom-nav">
    <a href="./home_dashboard.html" class="nav-item"><span class="material-icons-round">home</span><span class="nav-label">Home</span></a>
    <a href="./explore_map.html" class="nav-item"><span class="material-icons-round">explore</span><span class="nav-label">Map</span></a>
    <a href="./create_activity.html" class="nav-fab"><span class="material-icons-round">add</span></a>
    <a href="./community_hub.html" class="nav-item"><span class="material-icons-round">group</span><span class="nav-label">Community</span></a>
    <a href="./user_profile.html" class="nav-item"><span class="material-icons-round">person</span><span class="nav-label">Profile</span></a>
  </nav>
</div>
<script>document.getElementById('obsDate').valueAsDate=new Date();document.getElementById('mu').addEventListener('click',function(){document.getElementById('mi').click();});</script>
</body>
</html>
