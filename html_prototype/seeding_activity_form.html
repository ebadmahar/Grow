<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grōv — Seed Bombing Log</title>
  <link rel="stylesheet" href="./shared-ios-glass.css"/>
  <style>
    .media-upload {
      height: 110px; border: 1.5px dashed var(--card-border);
      border-radius: var(--r-md); background: var(--surface);
      display: grid; place-items: center; cursor: pointer;
    }
    .upload-inner { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .upload-inner .material-icons-round { font-size: 28px; color: var(--text-muted); }
    .upload-label { font-size: 12px; font-weight: 600; color: var(--text-3); }
    .upload-sub { font-size: 10px; color: var(--text-muted); }
    .gps-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; background: var(--surface); border-radius: var(--r-sm);
      border: 1.5px solid var(--card-border);
    }
    .gps-info { display: flex; align-items: center; gap: 8px; }
    .gps-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ADE80; }
    .gps-text { font-size: 12px; font-weight: 600; color: var(--text-2); }
    .gps-btn { font-size: 11px; font-weight: 700; color: var(--ink); background: var(--lime); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
    .form-card {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: var(--r-xl); padding: 20px;
      display: flex; flex-direction: column; gap: 14px;
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>
<div class="app-shell screen">

  <header class="app-header">
    <a href="./create_activity.html" class="icon-btn">
      <span class="material-icons-round">arrow_back</span>
    </a>
    <h1 class="header-title">Seed Bombing</h1>
    <a href="./notifications.html" class="icon-btn">
      <span class="material-icons-round">notifications</span>
    </a>
  </header>

  <main class="p-page" style="display:flex;flex-direction:column;gap:14px;">

    <div class="anim" style="display:flex;align-items:center;gap:10px;padding:14px;background:rgba(122,90,248,0.06);border:1px solid rgba(122,90,248,0.18);border-radius:var(--r-md);">
      <span class="material-icons-round" style="color:#7A5AF8;font-size:18px;">info</span>
      <p style="font-size:11px;color:#5B3FAF;line-height:1.5;">Seeding and plantation are tracked separately. Seeds reported here will not be combined with sapling counts.</p>
    </div>

    <form id="seedingForm" action="./seeding_confirmation.html" class="form-card anim anim-2">

      <div class="form-group">
        <label class="form-label">Seed Species</label>
        <select id="seedSpecies" class="form-input form-select">
          <option>Acacia Modesta (Phulai)</option>
          <option>Pinus Roxburghii (Chir Pine)</option>
          <option>Ziziphus Jujuba (Ber)</option>
          <option>Ficus Religiosa (Peepal)</option>
          <option>Mixed Native Seeds</option>
        </select>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Seeds Dispersed</label>
          <input id="seedCount" type="number" class="form-input" value="500" min="1"/>
        </div>
        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="date" class="form-input" id="seedDate"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Dispersal Method</label>
        <select class="form-input form-select">
          <option>Hand Broadcasting</option>
          <option>Seed Bombing (aerial)</option>
          <option>Seed Drill</option>
          <option>Hydroseeding</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Site Name</label>
        <input id="seedLocation" type="text" class="form-input" placeholder="e.g. G-11 Margalla Trail" value="G-11 Margalla Trail"/>
      </div>

      <div class="form-group">
        <label class="form-label">GPS Location</label>
        <div class="gps-row">
          <div class="gps-info">
            <div class="gps-dot"></div>
            <span class="gps-text" id="gpsText">33.7294, 73.0931</span>
          </div>
          <div class="gps-btn" id="refreshGps">Refresh</div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Coverage Area (sqm)</label>
        <input type="number" class="form-input" placeholder="Estimated area covered" value="2000"/>
      </div>

      <div class="form-group">
        <label class="form-label">Field Notes</label>
        <textarea class="form-input form-textarea" placeholder="Soil condition, rainfall, terrain..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Photos / Evidence</label>
        <div class="media-upload" id="mediaUpload">
          <div class="upload-inner">
            <span class="material-icons-round">add_photo_alternate</span>
            <span class="upload-label">Add Photos</span>
            <span class="upload-sub">JPG, PNG · Up to 5 images</span>
          </div>
        </div>
        <input type="file" id="mediaInput" accept="image/*" multiple style="display:none;"/>
      </div>

      <button type="submit" class="btn btn-primary" style="margin-top:4px;">
        <span class="material-icons-round" style="font-size:18px;">check_circle</span>
        Submit Seed Bombing Log
      </button>
    </form>
  </main>

  <nav class="bottom-nav">
    <a href="./home_dashboard.html" class="nav-item"><span class="material-icons-round">home</span><span class="nav-label">Home</span></a>
    <a href="./explore_map.html" class="nav-item"><span class="material-icons-round">explore</span><span class="nav-label">Map</span></a>
    <a href="./create_activity.html" class="nav-fab"><span class="material-icons-round">add</span></a>
    <a href="./community_hub.html" class="nav-item"><span class="material-icons-round">group</span><span class="nav-label">Community</span></a>
    <a href="./user_profile.html" class="nav-item"><span class="material-icons-round">person</span><span class="nav-label">Profile</span></a>
  </nav>
</div>
<script>
  document.getElementById('seedDate').valueAsDate = new Date();
  document.getElementById('mediaUpload').addEventListener('click', function() { document.getElementById('mediaInput').click(); });
  document.getElementById('refreshGps').addEventListener('click', function() {
    navigator.geolocation && navigator.geolocation.getCurrentPosition(function(pos) {
      document.getElementById('gpsText').textContent = pos.coords.latitude.toFixed(5) + ', ' + pos.coords.longitude.toFixed(5);
    });
  });
  document.getElementById('seedingForm').addEventListener('submit', function() {
    var logs = JSON.parse(localStorage.getItem('userRestorationLogs') || '[]');
    logs.push({
      id: Date.now(),
      title: document.getElementById('seedLocation').value || 'Seed Site',
      species: document.getElementById('seedSpecies').value,
      count: parseInt(document.getElementById('seedCount').value) || 500,
      lat: 33.7310 + (Math.random() * 0.02 - 0.01),
      lng: 73.0850 + (Math.random() * 0.02 - 0.01),
      type: 'seeding'
    });
    localStorage.setItem('userRestorationLogs', JSON.stringify(logs));
  });
</script>
</body>
</html>
