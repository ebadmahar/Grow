<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grōv — Sign In</title>
  <link rel="stylesheet" href="./shared-ios-glass.css"/>
  <style>
    .login-shell {
      width: 100%; max-width: 430px; min-height: 100dvh;
      margin: 0 auto; padding: 52px 20px 32px;
      display: flex; flex-direction: column; gap: 32px;
      background: var(--surface);
    }
    .back-btn {
      position: absolute; top: 16px; left: 16px;
      width: 36px; height: 36px; border-radius: var(--r-sm);
      background: var(--card); border: 1px solid var(--card-border);
      display: grid; place-items: center; color: var(--text-2);
    }
    .form-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--r-xl);
      padding: 20px;
      display: flex; flex-direction: column; gap: 16px;
      box-shadow: var(--shadow-sm);
    }
    .forgot-row { display: flex; align-items: center; justify-content: space-between; }
    .forgot-link { font-size: 11px; font-weight: 700; color: var(--text-3); }
    .divider { height: 1px; background: var(--card-border); }
    .footer-link { text-align: center; font-size: 13px; font-weight: 600; color: var(--text-3); }
    .footer-link span { color: var(--text-1); font-weight: 700; }
  </style>
</head>
<body style="background:var(--surface);">
  <a href="./welcome_screen.html" class="back-btn">
    <span class="material-icons-round" style="font-size:18px;">arrow_back</span>
  </a>

  <div class="login-shell">
    <div class="anim" style="display:flex;flex-direction:column;gap:12px;">
      <div class="entry-mark">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 21V13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M12 17C12 17 7 15 6.5 10C6.5 10 9.5 8.5 12 17Z" fill="currentColor"/>
          <path d="M12 13C12 13 17 11 17.5 6C17.5 6 14.5 4.5 12 13Z" fill="currentColor" opacity="0.55"/>
        </svg>
      </div>
      <span class="entry-kicker">Field Space</span>
      <h1 class="entry-h1">Good to<br>see you.</h1>
      <p class="entry-sub">Pick up where your restoration work left off.</p>
    </div>

    <form id="loginForm" action="./home_dashboard.html" class="form-card anim anim-2">
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email Address</label>
        <input id="loginEmail" type="email" class="form-input" placeholder="you@example.com" value="field.monitor@grov.app"/>
      </div>
      <div class="form-group">
        <div class="forgot-row">
          <label class="form-label" for="loginPass">Password</label>
          <a href="./forgot_password.html" class="forgot-link">Forgot password?</a>
        </div>
        <input id="loginPass" type="password" class="form-input" value="••••••••"/>
      </div>
      <div class="divider"></div>
      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>

    <a href="./register_screen.html" class="footer-link anim anim-3">Don't have an account? <span>Register</span></a>
  </div>
</body>
</html>
